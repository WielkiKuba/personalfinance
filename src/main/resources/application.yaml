spring:
  datasource:
    url: jdbc:mysql://${DB_URL}/personal_finance?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
    locations: classpath:db/migration
  application:
    name: personalfinance

server:
  port: ${SERVER_PORT:8080}